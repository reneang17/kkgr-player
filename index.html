<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khenchen Rinpoche · Teachings</title>
  <!-- Links shared before the landing page existed point at /?lesson=<id>, when
       this page was the player. Forward them to the player so they keep working.
       Inline and in <head> so it runs before anything renders. -->
  <script>
    if (/[?&]lesson=/.test(location.search)) {
      location.replace('watch.html' + location.search + location.hash);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Provisional landing page. It is generated from lessons/index.js, so
       registering a lesson is enough to list it here. A host site that has its
       own navigation can drop this page and link to watch.html?lesson=<id>. -->
  <div class="app-container">
    <header class="page-header">
      <h1>Khenchen Rinpoche</h1>
      <p class="subtitle">Teachings on the Jewel Ornament of Liberation</p>
    </header>

    <section class="lesson-index" aria-label="Teachings">
      <ol class="lesson-list" id="lesson-list">
        <!-- Rendered by landing.js -->
      </ol>
    </section>
  </div>

  <script type="module" src="landing.js"></script>
</body>
</html>
